[project]
name = "dft-learning-lab"
version = "0.1.0"
description = "Apple Silicon CPU lab for molecular and periodic DFT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ase>=3.26,<4",
  "rdkit>=2025.3",
  "pymatgen>=2025.1",
  "spglib>=2.5,<3",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "matplotlib>=3.10,<4",
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "py3dmol>=2.4,<3",
  "cclib>=1.8,<2",
  "pyscf>=2.10,<3",
  "geometric>=1.1,<2",
  "psutil>=7,<8",
]

[tool.uv]
package = false
